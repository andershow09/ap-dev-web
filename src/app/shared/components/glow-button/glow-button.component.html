@if (href()) {
  <a
    [href]="href()"
    [target]="target()"
    rel="noopener noreferrer"
    [class]="buttonClasses()"
  >
    <ng-container *ngTemplateOutlet="btnContent" />
  </a>
} @else {
  <button
    type="button"
    (click)="clicked.emit()"
    [class]="buttonClasses()"
  >
    <ng-container *ngTemplateOutlet="btnContent" />
  </button>
}

<ng-template #btnContent>
  @if (label()) {
    <span>{{ label() }}</span>
  }
  <ng-content />
</ng-template>
