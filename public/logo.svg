  <path d="M24 72L38 40C38.8 38.5 41.2 38.5 42 40L56 72" stroke="#F7F8F8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M29 62H51" stroke="#F7F8F8" stroke-width="4.5" stroke-linecap="round" />

  <!-- Monogram Letter 'P' -->
  <path d="M52 40H66C72 40 76 44 76 49.5C76 55 72 59 66 59H52V72" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

