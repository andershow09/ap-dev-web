<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ap-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>
    <linearGradient id="ap-stroke" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E6AD2" />
      <stop offset="100%" stop-color="#38BDF8" />
