<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-canvas" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="45%" stop-color="#0E1116" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>

    <radialGradient id="glow-indigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380, 160) rotate(45) scale(480 320)">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#5E6AD2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1320, 180) rotate(-30) scale(460 290)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#22262E" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="1" fill="#5E6AD2" fill-opacity="0.3" />
    </pattern>

    <!-- Logo Gradients -->
    <linearGradient id="logo-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>
    <linearGradient id="logo-stroke" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E6AD2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Terminal Gradients -->
    <linearGradient id="terminal-card-bg" x1="0" y1="0" x2="550" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12151B" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0.90" />
    </linearGradient>
    <linearGradient id="terminal-card-stroke" x1="0" y1="0" x2="550" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#5E6AD2" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#22262E" stop-opacity="0.65" />
    </linearGradient>

    <!-- Category Card Gradients -->
    <linearGradient id="card-mobile-bg" x1="0" y1="0" x2="310" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141822" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0D1016" stop-opacity="0.80" />
    </linearGradient>
    <linearGradient id="card-fullstack-bg" x1="0" y1="0" x2="310" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171626" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0D0E16" stop-opacity="0.80" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>

  <!-- 1. Canvas Background -->
  <rect width="1584" height="396" fill="url(#bg-canvas)" />
  <rect width="1584" height="396" fill="url(#tech-grid)" opacity="0.85" />
  <rect width="1584" height="396" fill="url(#glow-indigo)" />
  <rect width="1584" height="396" fill="url(#glow-cyan)" />

  <!-- Top Accent Light Bar -->
  <line x1="0" y1="1" x2="1584" y2="1" stroke="url(#logo-stroke)" stroke-width="2.5" opacity="0.9" />

  <!-- ============================================================== -->
  <!-- 2. BRAND SIGNATURE & HEADLINE (CENTER-LEFT: x: 290)            -->
  <!-- Leaves x: 40..250, y: 220..396 clear for LinkedIn avatar circle-->
  <!-- ============================================================== -->
  <g transform="translate(290, 50)">
    
    <!-- Monolith Logo Icon (96x96) -->
    <g transform="translate(0, 4)">
      <!-- Squircle Base Frame -->
      <rect x="0" y="0" width="94" height="94" rx="26" fill="url(#logo-bg)" stroke="url(#logo-stroke)" stroke-width="2.2" />

      <!-- Terminal Window Control Dots -->
      <circle cx="16" cy="16" r="3" fill="#EF4444" opacity="0.9" />
      <circle cx="24" cy="16" r="3" fill="#F59E0B" opacity="0.9" />
      <circle cx="32" cy="16" r="3" fill="#10B981" opacity="0.9" />
      <line x1="0" y1="25" x2="94" y2="25" stroke="white" stroke-opacity="0.1" stroke-width="1" />

      <!-- Monogram 'A' -->
      <path d="M18 70L34 35C34.8 33.5 37.2 33.5 38 35L54 70" stroke="#F7F8F8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M23 60H49" stroke="#F7F8F8" stroke-width="5" stroke-linecap="round" />

      <!-- Monogram 'P' -->
      <path d="M48 35H64C70.5 35 75 39 75 45C75 51 70.5 55 64 55H48V70" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Terminal 'dev' Badge -->
      <rect x="56" y="59" width="30" height="17" rx="4" fill="#5E6AD2" fill-opacity="0.35" stroke="#5E6AD2" stroke-opacity="0.8" stroke-width="1.2" />
      <text x="71" y="71" class="font-mono" font-size="10.5" font-weight="700" fill="#A5B4FC" text-anchor="middle">dev</text>
    </g>

    <!-- Brand Typography & Titles -->
    <g transform="translate(118, 0)">
      
      <!-- Main Brand Name -->
      <text x="0" y="46" class="font-sans" font-size="48" font-weight="900" fill="#F7F8F8" letter-spacing="-1.2">
        AP dev <tspan fill="#38BDF8">.</tspan>
      </text>

      <!-- Roles Headline -->
      <text x="0" y="80" class="font-sans" font-size="22" font-weight="700" fill="#E2E8F0" letter-spacing="-0.3">
        Mobile Engineer <tspan fill="#5E6AD2">|</tspan> Full Stack Developer
      </text>

      <!-- Specialist Subhead (Requested verbatim) -->
      <g transform="translate(0, 108)">
        <text x="0" y="0" class="font-sans" font-size="15" font-weight="600" fill="#38BDF8" letter-spacing="0.2">
          Especialista em Flutter, Ionic, Angular e Android
        </text>
      </g>
    </g>

    <!-- ========================================================== -->
    <!-- 2.1 SEPARATED FRAMEWORK CATEGORY CARDS (x: 0, y: 154)      -->
    <!-- Mobile (Flutter | Ionic | RN | Android)                    -->
    <!-- Full Stack (Angular | React | NestJS | Node)               -->
    <!-- ========================================================== -->
    <g transform="translate(0, 152)">
      
      <!-- CARD 1: MOBILE ECOSYSTEM -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="324" height="114" rx="14" fill="url(#card-mobile-bg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" />
        
        <!-- Header Pill -->
        <g transform="translate(14, 14)">
          <rect x="0" y="0" width="84" height="22" rx="6" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
          <text x="42" y="15" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle">📱 MOBILE</text>
        </g>
        <text x="108" y="29" class="font-mono" font-size="10.5" font-weight="500" fill="#64748B">Frameworks &amp; SDKs</text>

        <!-- Framework Badges / Chips Row 1 -->
        <g transform="translate(14, 46)">
          <!-- Flutter Chip -->
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="70" height="26" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1" />
            <text x="35" y="17" class="font-mono" font-size="11" font-weight="600" fill="#F7F8F8" text-anchor="middle">Flutter</text>
          </g>
          <!-- Ionic Chip -->
          <g transform="translate(76, 0)">
            <rect x="0" y="0" width="58" height="26" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1" />
            <text x="29" y="17" class="font-mono" font-size="11" font-weight="600" fill="#F7F8F8" text-anchor="middle">Ionic</text>
          </g>
          <!-- React Native Chip -->
          <g transform="translate(140, 0)">
            <rect x="0" y="0" width="76" height="26" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1" />
            <text x="38" y="17" class="font-mono" font-size="11" font-weight="600" fill="#F7F8F8" text-anchor="middle">React Native</text>
          </g>
          <!-- Android Chip -->
          <g transform="translate(222, 0)">
            <rect x="0" y="0" width="74" height="26" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1" />
            <text x="37" y="17" class="font-mono" font-size="11" font-weight="600" fill="#F7F8F8" text-anchor="middle">Android</text>
          </g>
        </g>

        <!-- Micro description -->
        <text x="14" y="98" class="font-mono" font-size="9.5" font-weight="500" fill="#64748B">
          Nativo · Híbrido · MVVM · Offline-First
        </text>
      </g>

      <!-- CARD 2: FULL STACK ECOSYSTEM -->
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="324" height="114" rx="14" fill="url(#card-fullstack-bg)" stroke="#5E6AD2" stroke-opacity="0.45" stroke-width="1.2" />
        
        <!-- Header Pill -->
        <g transform="translate(14, 14)">
          <rect x="0" y="0" width="102" height="22" rx="6" fill="#5E6AD2" fill-opacity="0.2" stroke="#5E6AD2" stroke-opacity="0.5" stroke-width="1" />
          <text x="51" y="15" class="font-mono" font-size="10.5" font-weight="700" fill="#A5B4FC" text-anchor="middle">⚡ FULL STACK</text>
        </g>
        <text x="126" y="29" class="font-mono" font-size="10.5" font-weight="500" fill="#64748B">Web &amp; Backend</text>

        <!-- Framework Badges / Chips Row 1 -->
        <g transform="translate(14, 46)">
          <!-- Angular Chip -->
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="72" height="26" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1" />
            <text x="36" y="17" class="font-mono" font-size="11" font-weight="600" fill="#F7F8F8" text-anchor="middle">Angular</text>
          </g>
          <!-- React Chip -->
          <g transform="translate(78, 0)">
            <rect x="0" y="0" width="60" height="26" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1" />
            <text x="30" y="17" class="font-mono" font-size="11" font-weight="600" fill="#F7F8F8" text-anchor="middle">React</text>
          </g>
          <!-- NestJS Chip -->
          <g transform="translate(144, 0)">
            <rect x="0" y="0" width="68" height="26" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1" />
            <text x="34" y="17" class="font-mono" font-size="11" font-weight="600" fill="#F7F8F8" text-anchor="middle">NestJS</text>
          </g>
          <!-- Node.js Chip -->
          <g transform="translate(218, 0)">
            <rect x="0" y="0" width="78" height="26" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1" />
            <text x="39" y="17" class="font-mono" font-size="11" font-weight="600" fill="#F7F8F8" text-anchor="middle">Node.js</text>
          </g>
        </g>

        <!-- Micro description -->
        <text x="14" y="98" class="font-mono" font-size="9.5" font-weight="500" fill="#64748B">
          Zoneless · Micro Frontends · REST / GraphQL
        </text>
      </g>

    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 3. RIGHT SIDE: DETAILED CAPABILITIES TERMINAL (x: 980)         -->
  <!-- ============================================================== -->
  <g transform="translate(980, 48)">
    
    <!-- Outer Glow Behind Terminal -->
    <rect x="-8" y="-8" width="556" height="316" rx="20" fill="none" stroke="#38BDF8" stroke-opacity="0.06" stroke-width="16" filter="blur(12px)" />

    <!-- Terminal Window Container -->
    <rect x="0" y="0" width="540" height="300" rx="16" fill="url(#terminal-card-bg)" stroke="url(#terminal-card-stroke)" stroke-width="1.5" />
    
    <!-- Window Header -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 524 0 C 532.84 0 540 7.16 540 16 L 540 38 L 0 38 Z" fill="#161B22" />
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="34" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="48" cy="19" r="4.5" fill="#10B981" />
    <text x="270" y="23.5" class="font-mono" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">ap-dev@terminal: ~/capabilities</text>
    <line x1="0" y1="38" x2="540" y2="38" stroke="#22262E" stroke-width="1" />

    <!-- Terminal Capabilities Output -->
    <g transform="translate(22, 60)">
      
      <!-- Command prompt -->
      <text x="0" y="0" class="font-mono" font-size="11.5" font-weight="600" fill="#38BDF8">$ ap-dev capabilities --all</text>

      <!-- Section 1: Mobile Capabilities -->
      <g transform="translate(0, 24)">
        <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8">● [MOBILE]</text>
        <text x="82" y="0" class="font-mono" font-size="11" font-weight="600" fill="#E2E8F0">Flutter · Ionic · React Native · Android</text>
        <text x="82" y="15" class="font-mono" font-size="10" font-weight="400" fill="#64748B">MVVM · Riverpod · BLoC · Capacitor · Offline-First</text>
      </g>

      <!-- Section 2: Full Stack & Web -->
      <g transform="translate(0, 68)">
        <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#818CF8">● [WEB / FULLSTACK]</text>
        <text x="144" y="0" class="font-mono" font-size="11" font-weight="600" fill="#E2E8F0">Angular 22+ · React · NestJS · Node</text>
        <text x="144" y="15" class="font-mono" font-size="10" font-weight="400" fill="#64748B">Zoneless Signals · Micro Frontends · TypeScript</text>
      </g>

      <!-- Section 3: Architecture & Quality -->
      <g transform="translate(0, 112)">
        <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#34D399">● [ENGINEERING]</text>
        <text x="124" y="0" class="font-mono" font-size="11" font-weight="600" fill="#E2E8F0">Clean Architecture · SOLID · DDD</text>
        <text x="124" y="15" class="font-mono" font-size="10" font-weight="400" fill="#64748B">80%+ Testes Obrigatórios · Vitest · Jest · TDD</text>
      </g>

      <!-- Section 4: AI & Cloud Systems -->
      <g transform="translate(0, 156)">
        <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#FBBF24">● [AI &amp; CLOUD]</text>
        <text x="108" y="0" class="font-mono" font-size="11" font-weight="600" fill="#E2E8F0">Agentic AI · MCP Tools · Cloudflare · Docker</text>
        <text x="108" y="15" class="font-mono" font-size="10" font-weight="400" fill="#64748B">Orquestração Autônoma · CI/CD · Edge Computing</text>
      </g>

      <!-- Interactive cursor status -->
      <g transform="translate(0, 204)">
        <text x="0" y="0" class="font-mono" font-size="11" font-weight="600" fill="#A5B4FC">&gt; all capabilities operational</text>
        <rect x="226" y="-10" width="8" height="13" fill="#38BDF8" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

  </g>

  <!-- Bottom Accent Edge Line -->
  <line x1="0" y1="395" x2="1584" y2="395" stroke="#22262E" stroke-width="1" />
</svg>
