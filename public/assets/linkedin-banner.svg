<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-canvas" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="45%" stop-color="#0E1116" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>

    <radialGradient id="glow-indigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380, 160) rotate(45) scale(480 320)">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#5E6AD2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1320, 180) rotate(-30) scale(440 280)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#22262E" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="1" fill="#5E6AD2" fill-opacity="0.3" />
    </pattern>

    <!-- Logo Gradients -->
    <linearGradient id="logo-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>
    <linearGradient id="logo-stroke" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E6AD2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Terminal Gradients -->
    <linearGradient id="terminal-card-bg" x1="0" y1="0" x2="480" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12151B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="terminal-card-stroke" x1="0" y1="0" x2="480" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#5E6AD2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22262E" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>

  <!-- 1. Canvas Background -->
  <rect width="1584" height="396" fill="url(#bg-canvas)" />
  
  <!-- Subtle Grid Background -->
  <rect width="1584" height="396" fill="url(#tech-grid)" opacity="0.85" />

  <!-- Ambient Glows -->
  <rect width="1584" height="396" fill="url(#glow-indigo)" />
  <rect width="1584" height="396" fill="url(#glow-cyan)" />

  <!-- Top Accent Light Bar -->
  <line x1="0" y1="1" x2="1584" y2="1" stroke="url(#logo-stroke)" stroke-width="2" opacity="0.8" />

  <!-- ============================================================== -->
  <!-- 2. BRAND SIGNATURE & HEADLINE (CENTER-LEFT: x: 300 to 920)     -->
  <!-- Leaves x: 40..250, y: 220..396 clear for LinkedIn circular avatar -->
  <!-- ============================================================== -->
  <g transform="translate(300, 78)">
    
    <!-- Monolith Logo Icon (100x100) -->
    <g transform="translate(0, 8)">
      <!-- Squircle Base Frame -->
      <rect x="0" y="0" width="94" height="94" rx="26" fill="url(#logo-bg)" stroke="url(#logo-stroke)" stroke-width="2.2" />
      <circle cx="94" cy="0" r="16" fill="#38BDF8" opacity="0.15" filter="blur(8px)" />

      <!-- Terminal Window Control Dots -->
      <circle cx="16" cy="16" r="3" fill="#EF4444" opacity="0.9" />
      <circle cx="24" cy="16" r="3" fill="#F59E0B" opacity="0.9" />
      <circle cx="32" cy="16" r="3" fill="#10B981" opacity="0.9" />
      <line x1="0" y1="25" x2="94" y2="25" stroke="white" stroke-opacity="0.1" stroke-width="1" />

      <!-- Monogram 'A' -->
      <path d="M18 70L34 35C34.8 33.5 37.2 33.5 38 35L54 70" stroke="#F7F8F8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M23 60H49" stroke="#F7F8F8" stroke-width="5" stroke-linecap="round" />

      <!-- Monogram 'P' -->
      <path d="M48 35H64C70.5 35 75 39 75 45C75 51 70.5 55 64 55H48V70" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Terminal 'dev' Badge -->
      <rect x="56" y="59" width="30" height="17" rx="4" fill="#5E6AD2" fill-opacity="0.35" stroke="#5E6AD2" stroke-opacity="0.8" stroke-width="1.2" />
      <text x="71" y="71" class="font-mono" font-size="10.5" font-weight="700" fill="#A5B4FC" text-anchor="middle">dev</text>
    </g>

    <!-- Brand Typography & Titles -->
    <g transform="translate(118, 0)">
      
      <!-- Top Eyebrow Status Badge -->
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="220" height="24" rx="12" fill="#12151B" stroke="#22262E" stroke-width="1" />
        <circle cx="12" cy="12" r="3.5" fill="#10B981" />
        <circle cx="12" cy="12" r="5" stroke="#10B981" stroke-width="1" opacity="0.5" />
        <text x="24" y="16" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">DISPONÍVEL PARA PROJETOS</text>
      </g>

      <!-- Main Name / Brand Title -->
      <text x="0" y="68" class="font-sans" font-size="44" font-weight="900" fill="#F7F8F8" letter-spacing="-1.2">
        AP dev <tspan fill="#38BDF8">.</tspan>
      </text>

      <!-- Core Roles (Bold Headline) -->
      <g transform="translate(0, 102)">
        <text x="0" y="0" class="font-sans" font-size="21" font-weight="700" fill="#E2E8F0" letter-spacing="-0.3">
          Mobile Engineer <tspan fill="#5E6AD2">|</tspan> Full Stack Developer
        </text>
        <text x="0" y="24" class="font-sans" font-size="14.5" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
          Especialista em Flutter, Android, Angular 22+, NestJS &amp; Arquitetura Limpa
        </text>
      </g>

      <!-- Pillar Tech Chips / Badges -->
      <g transform="translate(0, 154)">
        <!-- Mobile Pill -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="168" height="28" rx="14" fill="#1A202C" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
          <text x="14" y="18" class="font-mono" font-size="11.5" font-weight="600" fill="#38BDF8">📱 Flutter · Mobile</text>
        </g>
        <!-- Full Stack Pill -->
        <g transform="translate(178, 0)">
          <rect x="0" y="0" width="186" height="28" rx="14" fill="#1A202C" stroke="#5E6AD2" stroke-opacity="0.5" stroke-width="1" />
          <text x="14" y="18" class="font-mono" font-size="11.5" font-weight="600" fill="#818CF8">⚡ Angular 22 · NestJS</text>
        </g>
        <!-- Architecture Pill -->
        <g transform="translate(374, 0)">
          <rect x="0" y="0" width="194" height="28" rx="14" fill="#1A202C" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
          <text x="14" y="18" class="font-mono" font-size="11.5" font-weight="600" fill="#34D399">🏗️ Clean Arch · Signals</text>
        </g>
      </g>

    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 3. RIGHT SIDE: TERMINAL WINDOW / ARCHITECTURE CARD (x: 1040)   -->
  <!-- ============================================================== -->
  <g transform="translate(1040, 56)">
    
    <!-- Outer Glow -->
    <rect x="-8" y="-8" width="496" height="296" rx="20" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="16" filter="blur(10px)" />

    <!-- Terminal Window Container -->
    <rect x="0" y="0" width="480" height="280" rx="16" fill="url(#terminal-card-bg)" stroke="url(#terminal-card-stroke)" stroke-width="1.5" />
    
    <!-- Window Header -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 464 0 C 472.84 0 480 7.16 480 16 L 480 38 L 0 38 Z" fill="#161B22" />
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="34" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="48" cy="19" r="4.5" fill="#10B981" />
    <text x="240" y="23" class="font-mono" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">ap-dev@terminal ~</text>
    <line x1="0" y1="38" x2="480" y2="38" stroke="#22262E" stroke-width="1" />

    <!-- Terminal Content Lines -->
    <g transform="translate(24, 64)">
      <!-- Line 1: Command -->
      <text x="0" y="0" class="font-mono" font-size="12" font-weight="600" fill="#38BDF8">$ ap-dev info --capabilities</text>

      <!-- Line 2: Mobile Stack -->
      <g transform="translate(0, 26)">
        <text x="0" y="0" class="font-mono" font-size="11.5" font-weight="700" fill="#818CF8">● [MOBILE]</text>
        <text x="82" y="0" class="font-mono" font-size="11.5" font-weight="500" fill="#E2E8F0">Flutter · Android Nativo · iOS</text>
        <text x="82" y="16" class="font-mono" font-size="10.5" font-weight="400" fill="#64748B">MVVM · Riverpod · BLoC · Offline First</text>
      </g>

      <!-- Line 3: Full Stack -->
      <g transform="translate(0, 72)">
        <text x="0" y="0" class="font-mono" font-size="11.5" font-weight="700" fill="#38BDF8">● [FULLSTACK]</text>
        <text x="96" y="0" class="font-mono" font-size="11.5" font-weight="500" fill="#E2E8F0">Angular 22+ (Zoneless) · NestJS</text>
        <text x="96" y="16" class="font-mono" font-size="10.5" font-weight="400" fill="#64748B">TypeScript · Node · Micro Frontends</text>
      </g>

      <!-- Line 4: Engineering Standards -->
      <g transform="translate(0, 118)">
        <text x="0" y="0" class="font-mono" font-size="11.5" font-weight="700" fill="#34D399">● [STANDARDS]</text>
        <text x="106" y="0" class="font-mono" font-size="11.5" font-weight="500" fill="#E2E8F0">SOLID · Clean Code · 80%+ Testes</text>
        <text x="106" y="16" class="font-mono" font-size="10.5" font-weight="400" fill="#64748B">TDD · Vitest · Conventional Commits</text>
      </g>

      <!-- Line 5: Interactive Cursor Prompt -->
      <g transform="translate(0, 160)">
        <text x="0" y="0" class="font-mono" font-size="11.5" font-weight="600" fill="#A5B4FC">&gt; ready for production</text>
        <rect x="156" y="-10" width="8" height="14" fill="#38BDF8" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

  </g>

  <!-- Bottom Accent Edge Line -->
  <line x1="0" y1="395" x2="1584" y2="395" stroke="#22262E" stroke-width="1" />
</svg>
